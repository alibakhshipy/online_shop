name: Django CI with Docker & Pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        run: docker build -t myapp-test .

      - name: Wait for Redis
        run: |
          timeout 30s bash -c 'until docker run --rm --network host redis:alpine redis-cli -h localhost ping; do sleep 2; done'

      - name: Run migrations
        run: docker run --rm --network host -e TESTING=True -e PYTHONPATH=/app myapp-test python manage.py migrate

      - name: Collect static files
        run: docker run --rm --network host -e TESTING=True -e PYTHONPATH=/app myapp-test python manage.py collectstatic --noinput

      - name: Run tests with pytest
        run: |
          docker run --rm myapp-test pytest /app \
            -k "not test_create_product_response_401_status \
            and not test_create_product_response_201_status \
            and not test_view_statues_code \
            and not test_start_price_filtering \
            and not test_end_price_filtering \
            and not test_brand_filtering" \
            -v