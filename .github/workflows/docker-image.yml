name: Django CI with Docker & Pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # 1. اضافه کردن سرویس Redis
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        run: docker build -t myapp-test .

      - name: Run migrations
        run: docker run --rm --network host myapp-test python manage.py migrate

      - name: Collect static files
        run: docker run --rm --network host myapp-test python manage.py collectstatic --noinput

      - name: Run tests with pytest
        run: docker run --rm --network host myapp-test pytest /app
