name: Django CI with Docker & Pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1) کد رو میاره توی runner
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) نصب docker و buildx
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      # 3) Build ایمیج پروژه
      - name: Build docker image
        run: docker build -t myapp-test .

      # 4) اجرای migrate
      - name: Run migrations
        run: docker run --rm myapp-test python manage.py migrate

      # 5) جمع کردن static ها
      - name: Collect static files
        run: docker run --rm myapp-test python manage.py collectstatic --noinput

      # 6) اجرای pytest
      - name: Run tests with pytest
        run: docker run --rm myapp-test pytest /app


