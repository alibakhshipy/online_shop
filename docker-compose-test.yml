version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      -"6379:6379"
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # برای live reload کد
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"